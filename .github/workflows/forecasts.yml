# Runs the forecasting engine on a schedule, with no server to look after.
#
# Two schedules, exactly what cron would do on a box:
#   05:30 daily     fits every league and forecasts upcoming fixtures
#   every 6 hours   fills in results for matches that have finished
#
# Both commit their output back to the repository, which is what makes the
# website update. The SQLite file is committed too: it is the durable record of
# what was forecast BEFORE each match, which is what makes the public track
# record trustworthy. Keeping it in git gives it free version history as well.

name: Forecasts

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "0 */6 * * *"
  workflow_dispatch:

# One run at a time. Two runs writing the same database would corrupt it - the
# same reason the server version takes a lock.
concurrency:
  group: forecasts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Says, in the run's annotations, whether the upstream feed answers this
      # runner at all - and with what. A failing job otherwise only reports an
      # exit code, and the difference between "403, we are blocked", "timeout,
      # the site is down" and "DNS" decides what to do next. Annotations are
      # readable without opening the logs, so this survives being diagnosed
      # from a phone.
      - name: Results feed reachability
        if: always()
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          # Is the API usable from here at all? Length only - the value is
          # never printed, and GitHub masks secrets in logs regardless.
          if [ -n "$FOOTBALL_DATA_TOKEN" ]; then
            echo "::notice title=api token::present, ${#FOOTBALL_DATA_TOKEN} characters"
            code=$(curl -s -o /dev/null -m 25 \
                   -H "X-Auth-Token: $FOOTBALL_DATA_TOKEN" \
                   -w '%{http_code}' \
                   "https://api.football-data.org/v4/competitions/PL/teams") \
              || code="unreachable"
            echo "::notice title=api probe::competitions/PL/teams -> $code (200 means working)"
          else
            echo "::error title=api token missing::The FOOTBALL_DATA_TOKEN secret is not set on this repository. Add it at Settings -> Secrets and variables -> Actions."
          fi

          for u in "https://www.football-data.co.uk/fixtures.csv" \
                   "https://www.football-data.co.uk/mmz4281/2627/E0.csv" \
                   "https://www.football-data.co.uk/"; do
            out=$(curl -sS -o /dev/null -m 25 -A "Mozilla/5.0" \
                  -w '%{http_code} %{size_download}b %{time_total}s' "$u" 2>&1) \
              || out="unreachable: $out"
            echo "::notice title=feed probe::${u#https://www.football-data.co.uk} -> $out"
          done

      # The guard that matters most. If this fails, future information is
      # reaching the training data and nothing should be published.
      - name: Leakage audit
        run: python -m tests.test_leakage

      - name: Store guarantees
        run: python -m tests.test_store

      # The join between the two sources. A name pointed at the wrong club
      # settles a forecast against a different match and nothing looks wrong
      # on screen, so this runs on every commit. Needs no token.
      - name: Team name mapping
        run: python -m tests.test_aliases

      # The token is read from the environment and never written to disk or
      # printed. football-data.co.uk returns 503 to these runners, so the API
      # is the source that actually works here; the CSV feed stays as a
      # fallback for runs from an ordinary connection.
      - name: Forecast upcoming fixtures
        if: github.event.schedule != '0 */6 * * *'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python -m engine.run

      - name: Settle finished matches
        if: github.event.schedule != '30 5 * * *'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python -m engine.settle

      - name: Publish
        run: |
          git config user.name "forecast-bot"
          git config user.email "actions@github.com"
          git add -f output/*.json data/forecasts.db
          if git diff --cached --quiet; then
            echo "Nothing changed. Between rounds this is normal, not a failure."
            exit 0
          fi
          git commit -m "Forecasts: $(date -u '+%Y-%m-%d %H:%M UTC')"

          # The push races anything else that writes to main - a human pushing,
          # or a re-run of an older run whose checkout predates newer commits.
          # A rejected push is transient, so rebase our single commit onto the
          # newer main and try again rather than failing the whole run.
          for attempt in 1 2 3; do
            if git push; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt - main moved; rebasing onto it"
            if ! git pull --rebase --no-edit origin main; then
              git rebase --abort || true
              echo "::error::Rebase conflicted, most likely on data/forecasts.db."
              echo "Not forcing: the remote database may hold forecasts this run"
              echo "never saw, and overwriting it would destroy record history."
              echo "The next scheduled run starts from the newer database and"
              echo "will re-derive everything, so this is self-healing."
              exit 1
            fi
          done
          echo "::error::Could not publish after 3 attempts."
          exit 1

      - name: Summary
        if: always()
        run: python tools/ci_summary.py >> "$GITHUB_STEP_SUMMARY"
